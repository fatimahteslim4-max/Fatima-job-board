<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fatimah's Job Board</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#4f46e5;color:#fff;padding:24px}main{max-width:1000px;margin:18px auto;padding:0 14px}.card,.job{background:#fff;border:1px solid #e2e6ef;border-radius:14px;padding:15px;margin-bottom:12px}button{background:#4f46e5;color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:700}.bar{display:flex;gap:8px;flex-wrap:wrap}input,select{padding:10px;border:1px solid #ccd4e3;border-radius:9px;font:inherit}.job{margin-top:10px}.meta,.small{color:#66718a;font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}.tag{background:#eef1f7;border-radius:99px;padding:5px 8px;font-size:12px}.good{background:#e9f8ef;color:#087443}.empty{text-align:center;padding:25px;color:#66718a}
</style></head><body><header><h1>Fatimah's Job Board</h1><div>Server-side collector • $60,000+ • fresh remote jobs</div></header><main>
<div class="card"><div class="bar"><input id="q" placeholder="Search jobs, companies or skills"><select id="hours"><option value="24">Last 24 hours</option><option value="48" selected>Last 48 hours</option><option value="72">Last 72 hours</option><option value="168">Last 7 days</option><button onclick="loadJobs()">Refresh jobs</button></div><p id="status" class="small">Loading…</p></div><div id="jobs"></div></main>
<script>
let jobs=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function age(d){return Math.max(0,(Date.now()-new Date(d).getTime())/36e5)}
function render(){let q=document.getElementById('q').value.toLowerCase(),h=+document.getElementById('hours').value;let a=jobs.filter(j=>age(j.postedAt)<=h&&(j.title+' '+j.company+' '+j.description+' '+j.location).toLowerCase().includes(q));document.getElementById('status').textContent=a.length+' matching jobs • server refreshed '+new Date().toLocaleTimeString();document.getElementById('jobs').innerHTML=a.length?a.map(j=>`<article class="job"><h3>${esc(j.title)}</h3><div class="meta">${esc(j.company)} • ${esc(j.location)}</div><div class="tags"><span class="tag good">$${Number(j.salaryMin||0).toLocaleString()}–$${Number(j.salaryMax||0).toLocaleString()}/year</span><span class="tag">Posted ${Math.round(age(j.postedAt))}h ago</span><span class="tag">Match ${j.matchScore}%</span><span class="tag">${esc(j.source)}</span></div><div>${esc(j.description.slice(0,360))}…</div><p><button onclick='window.open(${JSON.stringify(j.url)},"_blank")'>Apply / View original</button></p></article>`).join(''):'<div class="card empty">No jobs match the current filters.</div>'}
async function loadJobs(){document.getElementById('status').textContent='Collecting jobs on the server…';try{let r=await fetch('/api/jobs?hours='+document.getElementById('hours').value+'&minSalary=60000');let d=await r.json();if(!r.ok)throw Error(d.error||'Server error');jobs=d.jobs||[];document.getElementById('status').textContent='Server collector returned '+jobs.length+' jobs. Sources: '+(d.sources||[]).join(', ');render()}catch(e){document.getElementById('status').textContent='Could not load jobs: '+e.message}}
document.getElementById('q').addEventListener('input',render);document.getElementById('hours').addEventListener('change',loadJobs);loadJobs();
</script></body></html>
